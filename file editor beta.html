<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Code Editor</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            background: url('https://source.unsplash.com/random/1920x1080') no-repeat center center fixed;
            background-size: cover;
        }
        #file-manager {
            width: 20%;
            background: rgba(34, 34, 34, 0.9);
            color: white;
            padding: 10px;
        }
        #editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
        }
        textarea {
            flex: 1;
            width: 100%;
            font-family: monospace;
        }
        iframe {
            height: 50vh;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="file-manager">
        <h3>Files</h3>
        <ul id="files"></ul>
        <button onclick="createFile()">New File</button>
        <button onclick="createFolder()">New Folder</button>
        <button onclick="deleteFile()">Delete File</button>
        <button onclick="downloadProject()">Download Project</button>
        <input type="file" id="upload" onchange="uploadFile(event)" style="display: none;">
        <button onclick="document.getElementById('upload').click()">Upload</button>
    </div>
    <div id="editor">
        <div id="file-buttons"></div>
        <textarea id="code" oninput="saveFileContent()"></textarea>
        <button onclick="runCode()">Run</button>
        <iframe id="output"></iframe>
    </div>

    <script>
        let files = JSON.parse(localStorage.getItem("files")) || {};
        let currentFile = "";

        function createFile() {
            let fileName = prompt("Enter file name (e.g., index.html)");
            if (fileName && !files[fileName]) {
                files[fileName] = "";
                saveToLocalStorage();
                updateFileList();
            }
        }

        function createFolder() {
            let folderName = prompt("Enter folder name");
            if (folderName && !files[folderName + "/"]) {
                files[folderName + "/"] = null;
                saveToLocalStorage();
                updateFileList();
            }
        }

        function deleteFile() {
            if (currentFile && confirm(`Are you sure you want to delete ${currentFile}?`)) {
                delete files[currentFile];
                document.getElementById("code").value = "";
                currentFile = "";
                saveToLocalStorage();
                updateFileList();
            }
        }

        function updateFileList() {
            let fileList = document.getElementById("files");
            fileList.innerHTML = "";
            let fileButtons = document.getElementById("file-buttons");
            fileButtons.innerHTML = "";
            for (let file in files) {
                let li = document.createElement("li");
                li.textContent = file;
                li.onclick = () => openFile(file);
                fileList.appendChild(li);
                
                let button = document.createElement("button");
                button.textContent = file;
                button.onclick = () => openFile(file);
                fileButtons.appendChild(button);
            }
        }

        function openFile(fileName) {
            if (files[fileName] !== null) {
                document.getElementById("code").value = files[fileName];
                currentFile = fileName;
            }
        }

        function saveFileContent() {
            if (currentFile) {
                files[currentFile] = document.getElementById("code").value;
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem("files", JSON.stringify(files));
        }

        function runCode() {
            if (currentFile) {
                saveFileContent();
                if (currentFile.endsWith(".html")) {
                    document.getElementById("output").srcdoc = files[currentFile];
                }
            } else {
                alert("No file open!");
            }
        }

        function downloadProject() {
            let zip = new JSZip();
            for (let file in files) {
                zip.file(file, files[file]);
            }
            zip.generateAsync({ type: "blob" }).then(function(content) {
                let a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "project.zip";
                a.click();
            });
        }

        function uploadFile(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    files[file.name] = e.target.result;
                    saveToLocalStorage();
                    updateFileList();
                };
                reader.readAsText(file);
            }
        }

        updateFileList();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
